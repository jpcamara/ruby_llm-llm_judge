name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        ruby_llm: ['1.13.2', '1.16.0']
        include:
          - ruby: '3.4'
            ruby_llm: main
    name: Ruby ${{ matrix.ruby }} / RubyLLM ${{ matrix.ruby_llm }}
    env:
      RUBY_LLM_VERSION: ${{ matrix.ruby_llm }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
